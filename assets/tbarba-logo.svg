<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Eye/leaf outer shape -->
  <path d="M 10,140 Q 90,15 200,15 Q 310,15 390,140 Q 310,265 200,265 Q 90,265 10,140 Z"
        stroke="#00ff00" stroke-width="12" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <!-- Left circle -->
  <circle cx="148" cy="120" r="32" stroke="#00ff00" stroke-width="10" fill="none" filter="url(#glow)"/>
  <circle cx="148" cy="120" r="14" fill="#00ff00" filter="url(#glow)"/>
  <!-- Right circle -->
  <circle cx="252" cy="120" r="28" stroke="#00ff00" stroke-width="10" fill="none" filter="url(#glow)"/>
  <circle cx="252" cy="120" r="12" fill="#00ff00" filter="url(#glow)"/>
</svg>
